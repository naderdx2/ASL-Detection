name: ASL Detection CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install fastapi uvicorn python-multipart httpx pytest
          pip install torch==2.5.1+cpu torchvision==0.20.1+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install mediapipe opencv-python-headless numpy Pillow pydantic
      - name: Create dummy model files
        run: |
          mkdir -p models
          echo '{"0": "A", "1": "B"}' > labels.json
          python -c "
          import torch
          import torch.nn as nn
          class ASLModel(nn.Module):
              def __init__(self, num_classes):
                  super().__init__()
                  self.network = nn.Sequential(
                      nn.Linear(63, 256), nn.ReLU(), nn.BatchNorm1d(256), nn.Dropout(0.3),
                      nn.Linear(256, 128), nn.ReLU(), nn.BatchNorm1d(128), nn.Dropout(0.3),
                      nn.Linear(128, 64), nn.ReLU(), nn.BatchNorm1d(64), nn.Dropout(0.3),
                      nn.Linear(64, num_classes)
                  )
              def forward(self, x):
                  return self.network(x)
          model = ASLModel(2)
          torch.save({'model_state_dict': model.state_dict(), 'num_classes': 2}, 'models/best_asl_model.pth')
          "
      - name: Run tests
        run: pytest tests/ -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - name: Build Docker image
        run: docker build -t asl-detection-api .

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install flake8
      - run: flake8 api.py --max-line-length=120 --ignore=E501,W503